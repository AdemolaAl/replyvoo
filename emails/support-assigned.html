<!-- subject: [{{ref}}] New ticket for you: {{subject}} -->
<!-- preheader: {{from_name}} via {{source}}: {{snippet}} -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 18px 0;">
  <tr>
    <td class="rv-soft" bgcolor="#FAF9F5" style="background-color:#FAF9F5;border:1px solid #EEEBE2;border-radius:999px;padding:6px 14px;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#5E5A50;">
      <span class="rv-muted" style="color:#5E5A50;vertical-align:middle;">Support desk</span>
    </td>
  </tr>
</table>
<h1 class="rv-h1" style="margin:0 0 14px 0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:30px;line-height:37px;font-weight:800;letter-spacing:-0.6px;color:#121110;">A ticket was assigned to you.</h1>
<p class="rv-text" style="margin:0 0 16px 0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#121110;">Hi {{name}}, <strong>{{from_name}}</strong> wrote in through {{source}}.</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;">
  <tr>
    <td class="rv-ink-card rv-shine" bgcolor="#121110" style="background-color:#121110;border:1px solid #121110;border-radius:20px;padding:24px 26px;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#FFFFFF;">
<p class="rv-on-ink-muted" style="margin:0 0 6px 0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#B9B4A8;">{{ref}} · {{subject}}</p>
<p class="rv-on-ink-muted" style="margin:0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:21px;color:#B9B4A8;">“{{snippet}}”</p>

    </td>
  </tr>
</table>
<table role="presentation" class="rv-btn-wrap" cellpadding="0" cellspacing="0" border="0" style="margin:0px 0 28px 0;">
  <tr>
    <td class="rv-btn-yellow" align="center" bgcolor="#FFC21A" style="background-color:#FFC21A;border-radius:14px;mso-padding-alt:15px 30px;">
      <a href="{{ticket_url}}" target="_blank" style="display:inline-block;padding:15px 30px;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:700;color:#121110;text-decoration:none;border-radius:14px;">Open the ticket&nbsp;&rarr;</a>
    </td>
  </tr>
</table>
<p class="rv-muted" style="margin:8px 0 0 0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:22px;color:#5E5A50;">&mdash; The Replyvoo team</p>
