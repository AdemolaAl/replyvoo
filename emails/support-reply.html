<!-- subject: Re: {{subject}} [{{ref}}] -->
<!-- preheader: {{agent_name}} from Replyvoo replied to your message. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 18px 0;">
  <tr>
    <td class="rv-soft" bgcolor="#FAF9F5" style="background-color:#FAF9F5;border:1px solid #EEEBE2;border-radius:999px;padding:6px 14px;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#5E5A50;">
      <span class="rv-muted" style="color:#5E5A50;vertical-align:middle;">Replyvoo support</span>
    </td>
  </tr>
</table>
<h1 class="rv-h1" style="margin:0 0 14px 0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:30px;line-height:37px;font-weight:800;letter-spacing:-0.6px;color:#121110;">{{agent_name}} replied.</h1>
<p class="rv-text" style="margin:0 0 16px 0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#121110;">Hi {{name}},</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;">
  <tr>
    <td class="rv-soft" bgcolor="#FAF9F5" style="background-color:#FAF9F5;border:1px solid #EEEBE2;border-radius:16px;padding:18px 20px;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:22px;color:#5E5A50;">
<p class="rv-text" style="margin:0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#121110;">{{{reply_html}}}</p>
    </td>
  </tr>
</table>
<p class="rv-text" style="margin:0 0 16px 0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#121110;">Just reply to this email to continue the conversation. Your ticket number is <strong>{{ref}}</strong>.</p>
<table role="presentation" class="rv-btn-wrap" cellpadding="0" cellspacing="0" border="0" style="margin:0px 0 28px 0;">
  <tr>
    <td class="rv-btn-yellow" align="center" bgcolor="#FFC21A" style="background-color:#FFC21A;border-radius:14px;mso-padding-alt:15px 30px;">
      <a href="{{dashboard_url}}" target="_blank" style="display:inline-block;padding:15px 30px;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:700;color:#121110;text-decoration:none;border-radius:14px;">Open my dashboard&nbsp;&rarr;</a>
    </td>
  </tr>
</table>
<p class="rv-muted" style="margin:8px 0 0 0;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:22px;color:#5E5A50;">&mdash; {{agent_name}}, Replyvoo support</p>
