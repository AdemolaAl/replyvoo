# Nginx reverse proxy for Replyvoo.
# Copy to /etc/nginx/sites-available/replyvoo, replace replyvoo.com with your domain,
# then: sudo ln -s /etc/nginx/sites-available/replyvoo /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d replyvoo.com -d www.replyvoo.com
# Full guide: docs/DEPLOYMENT.md (Path A)
#
# Before certbot has run, the certificate files below do not exist yet.
# Either start with only the port-80 server block (see DEPLOYMENT.md), or let
# "certbot --nginx" create the HTTPS block for you.

upstream replyvoo_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP: allow Let's Encrypt checks, send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name replyvoo.com www.replyvoo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://replyvoo.com$request_uri;
    }
}

# www -> bare domain over HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.replyvoo.com;

    ssl_certificate     /etc/letsencrypt/live/replyvoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replyvoo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://replyvoo.com$request_uri;
}

# The real site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name replyvoo.com;

    ssl_certificate     /etc/letsencrypt/live/replyvoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replyvoo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The app limits request bodies to 6 MB; leave some headroom here.
    client_max_body_size 8m;

    # The app already gzips its responses. Don't compress twice.
    gzip off;

    access_log /var/log/nginx/replyvoo.access.log;
    error_log  /var/log/nginx/replyvoo.error.log warn;

    location / {
        proxy_pass http://replyvoo_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (don't append) so visitors can't fake their IP. The app reads the
        # first X-Forwarded-For entry when TRUST_PROXY=true (rate limits use it).
        # If Cloudflare sits in front of Nginx, configure ngx_http_realip_module first.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
